name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        working-directory: macos
        run: CURSORLOOM_TLS_INTEGRATION=1 swift test -Xswiftc -warnings-as-errors
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test Windows protocol
        run: dotnet run --project windows-tests/InputBridge.Protocol.Tests.csproj --configuration Release
      - name: Test Windows TLS listener
        run: dotnet run --project windows-integration/InputBridge.Tls.Tests.csproj --configuration Release
      - name: Build Windows preview
        run: dotnet build windows-app/InputBridge.Windows.csproj --configuration Release
